name: Ejecutar Bot Dakhla Atlantique

on:
  schedule:
    # Se dispara 4 veces por hora, en minutos "raros" (no en punto) para
    # evitar el atasco que sufre GitHub cuando miles de repositorios
    # programan sus tareas justo a horas exactas (0/15/30/45). main.py
    # decide él solo si es el momento correcto de enviar (hora 8 en
    # Canarias) y evita reenviar si ya se envió hoy, así que el resto
    # de disparos simplemente no hacen nada.
    - cron: '13,28,43,58 * * * *'
  workflow_dispatch: # Permite lanzarlo manualmente desde GitHub Actions

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest

    # Permisos necesarios para que el bot pueda actualizar y hacer push del README.md
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script principal
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EJECUCION_MANUAL: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          python main.py

      - name: Guardar y subir cambios al README.md y registro.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          [ -f registro.json ] && git add registro.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática reporte diario [skip ci]" && git push)
