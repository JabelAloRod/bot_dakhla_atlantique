name: Ejecutar Bot Dakhla Atlantique

on:
  schedule:
    # 8:00 UTC -> 8:00 en Canarias en horario de INVIERNO (UTC+0)
    - cron: '0 8 * * *'
    # 7:00 UTC -> 8:00 en Canarias en horario de VERANO (UTC+1)
    - cron: '0 7 * * *'
  workflow_dispatch: # Permite lanzarlo manualmente desde GitHub Actions

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest

    # Permisos necesarios para que el bot pueda actualizar y hacer push del README.md
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script principal
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EJECUCION_MANUAL: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          python main.py

      - name: Guardar y subir cambios al README.md y registro.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          [ -f registro.json ] && git add registro.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática reporte diario [skip ci]" && git push)
